name: Deploy to WordPress.org

# PAUSED 2026-09-23, for the v3 release.
#
# This used to fire on every published release and push straight to wp.org SVN.
# From v3 the plugin is built elsewhere: the free artifact is GENERATED BY
# FREEMIUS from the premium build (it strips the Pro-only code), verified
# against the free-build contract, and only then deployed to SVN. A release
# published here is a public mirror of what already shipped, so letting this
# workflow run would deploy wp.org a second time - from a tree that is not the
# artifact anyone verified.
#
# It is disabled rather than deleted: the 10up configuration below is correct
# and worth keeping. `workflow_dispatch` means it can still be run by hand from
# the Actions tab if wp.org ever needs to be deployed from this repo again.
#
# To re-enable, restore the `release: types: [published]` trigger.
on:
  workflow_dispatch:

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: true
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: woocommerce-pay-for-payment
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{github.workspace}}/woocommerce-pay-for-payment.zip
        asset_name: woocommerce-pay-for-payment.zip
        asset_content_type: application/zip
